# Reference
# https://gist.github.com/shinzui/866897

# Allow color
set -g default-terminal "screen-256color"
# Allow scroll
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# scrollback buffer n lines
set -g history-limit 5000

# Split window vertically/horizontally
bind -n C-v split-window -h
bind -n C-h split-window -v
# Ctrl+w to kill pane
bind -n C-w kill-pane

# Create a new session (prefix + N)
bind N new-session
# rotate pane/window
bind -n C-q select-pane -t :.+

# Use vi-style key bindings in copy mode
set-window-option -g mode-keys vi

# Enter copy mode on mouse drag (left click and drag to select)
# MouseDrag1Pane: Triggered when dragging with left mouse button
bind-key -n MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -M"

# Keep selection highlighted until quitting copy-mode
# Unbind mouse release so selection isn't cleared
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Double LMB Select & Copy (Word) - in copy-mode-vi
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word-no-clear \; \
    send-keys -X copy-pipe-no-clear "pbcopy"

# Double LMB Select & Copy (Word) - when NOT in copy-mode
bind-key -n DoubleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-word \; \
    send-keys -X copy-pipe-no-clear "pbcopy"

# Copy keybindings (macOS - uses pbcopy)
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Save/restore sessions across reboots (tmux-resurrect + tmux-continuum)
set -g @resurrect-dir '~/.local/share/tmux/resurrect/$HOSTNAME'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if-shell 'test -d ~/.tmux/plugins/tmux-resurrect' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -d ~/.tmux/plugins/tmux-continuum' 'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
