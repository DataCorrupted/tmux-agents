# Settings of tmux-agents: tls, ttop, ttv and the presets. tls reads them from
# ~/.config/tmux-agents/tls.conf, or from the file that TLS_CONFIG names.
#
# Each setting shows its default value. To change one, remove the # in front
# of it and change the value. ttop and tmux hooks read the file when they
# start. These environment variables win over the file: TLS_PRESET ([preset]
# layout), TLS_CLAUDE ([agents] claude), TLS_AGENT_COMMANDS ([agents]
# commands). `tls config` shows the values that tls uses, and the lines that
# it ignores.

[ttop]
# The layout of ttop with neither -v nor -h. auto: vertical in a narrow
# window, or in a window taller than wide, else horizontal.
# layout = auto
# auto: ttop is vertical in a window narrower than this many columns.
# narrow = 60
# In a window with fewer lines than this, ttop has no blank lines, and its key
# hint is on the title line.
# short = 12
# ttop -f: the fewest columns of a vertical pane.
# fit-min-width = 16
# ttop -f: the most columns of a vertical pane. It also gets a third of the
# window at most.
# fit-max-width = 40

[ttv]
# The width of the bar, in columns: when ttv adds it, when the window changes
# size, and when you switch to a pane there.
# width = 25
# The width of the bar in a wide window (see [preset] wide).
# wide-width = 30
# ttv adds a bar only to a window at least this many columns wide.
# min-window = 81
# The ttop options of the bar. With -f, ttop fits the bar to the list: width
# and wide-width apply only when ttv adds it.
# options = -v

[tth]
# The height of the bar, in lines: when tth adds it, when the window changes
# size, and when you switch to a pane there.
# height = 10
# The height of the bar in a window that is taller than wide, in pixels.
# tall-height = 12
# tth adds a bar only to a window at least this many lines high.
# min-window = 30
# The ttop options of the bar. With -f, ttop fits the bar to the list: height
# and tall-height apply only when tth adds it.
# options = -h

[preset]
# Where t -p, ttop -p and tls preset put the bar. auto: on the right of a wide
# window, else at the bottom.
# layout = auto
# A window is wide from this width/height ratio in pixels on: 21:9 is 2.33,
# 16:9 is 1.78.
# wide = 2.25
# A wide window must also have room for two panes this many columns wide next
# to the bar.
# pane-width = 80
# The width of a bar on the right, until its ttop fits it to the list.
# right-width = 25
# A bar at the bottom starts at a fifth of the window, with this many lines at
# least, until its ttop fits it.
# bottom-min-lines = 5
# A bar at the bottom starts with this many lines at most.
# bottom-max-lines = 10

[resize]
# on: when a window changes size, its panes keep their proportions, and a ttop
# bar keeps its size (ttv and tth bars: see [ttv] and [tth]). off: tmux takes
# the same number of columns from each pane.
# proportional = on
# on: when you switch to a pane, window or session, a ttv or tth bar there
# that lost its size, as after a drag, gets it back, and the other panes share
# the change in proportion.
# keep-bars = on

[agents]
# The command that resumes a Claude Code session, as: claude --resume ID.
# claude = claude
# A pane that runs one of these commands shows as an agent before the agent
# reports.
# commands = claude codex gemini
# A dead agent stays in the list this many days, or until its transcript goes.
# keep-dead-days = 14

[reboot]
# on: after a reboot, the first tmux_autostart or ttop brings back each tmux
# session that the reboot stopped, as it was, with its agents. off: the dead
# agents stay in the list of ttop, where R brings them all back.
# bring-back = on
